services:
  pear-cm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pear-cm
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

name: Cancel stale Pear CM deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older bot runner deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100
            });
            const activeStates = new Set(["queued", "in_progress", "pending", "waiting", "requested"]);
            const stale = data.workflow_runs.filter(run =>
              run.path === ".github/workflows/main.yml" &&
              run.head_sha !== currentSha &&
              activeStates.has(run.status)
            );
            for (const run of stale) {
              core.info(`Cancelling stale Pear CM run #${run.run_number} (${run.head_sha}, ${run.status})`);
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
            }
            core.info(`Kept runs for current commit ${currentSha}; cancelled ${stale.length} stale run(s).`);

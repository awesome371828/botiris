name: Cancel stale Pear CM deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pear-cm-cancel-stale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel old GitHub-hosted Pear CM bot runners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100
            });
            const activeStates = new Set(["queued", "in_progress", "pending", "waiting", "requested"]);
            const stale = data.workflow_runs
              .filter(run =>
                run.path === ".github/workflows/main.yml" &&
                run.head_sha !== currentSha &&
                activeStates.has(run.status)
              )
              .sort((a, b) => Number(b.status === "in_progress") - Number(a.status === "in_progress"));
            let cancelled = 0;
            for (const run of stale) {
              core.info(`Cancelling old Pear CM run #${run.run_number} (status=${run.status}, sha=${run.head_sha})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled += 1;
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run #${run.run_number} finished before cancellation; continuing.`);
                  continue;
                }
                throw error;
              }
            }
            core.info(`Cancellation sweep finished. Cancellation requests accepted: ${cancelled}. Current SHA: ${currentSha}`);

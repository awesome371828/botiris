name: Pear CM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation run; don't pile up stale commits.
concurrency:
  group: pear-cm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: |
          python -m py_compile iris.py moderation_full.py
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check

name: Pear CM regression checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The bot runtime is hosted on RelaxDev. This workflow validates source only;
# it never starts a second Telegram polling process.
# elif [ "$code" -eq 23 ]; then: historical guard for TelegramConflictError exit code.
concurrency:
  group: pear-cm-ci
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile iris.py moderation_full.py pear_core.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

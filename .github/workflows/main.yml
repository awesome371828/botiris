name: Run Pear CM

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Start a fresh Actions job roughly every 6 hours (UTC).
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs have a hard time limit; leave a little room before the next scheduled run.
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile iris.py

      - name: Run bot and restart it every 3 hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_OWNER_ID: "6652898792"
        shell: bash
        run: |
          set -u
          while true; do
            echo "Starting bot at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Run for at most 3 hours, then stop and start a fresh process.
            timeout --signal=TERM --kill-after=30s 3h python -u iris.py
            exit_code=$?
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              echo "Three-hour process window ended; restarting bot."
            else
              echo "Bot exited with code ${exit_code}; retrying in 10 seconds."
            fi
            sleep 10
          done

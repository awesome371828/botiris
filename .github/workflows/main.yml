name: Retired Pear CM bot runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The Telegram bot now runs on RelaxDev. Reuse the old concurrency group once
# to stop any already-running GitHub-hosted polling process on the same token.
concurrency:
  group: pear-cm-bot
  cancel-in-progress: true

jobs:
  confirm-hosting-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub Actions no longer starts the Telegram bot
        run: |
          echo "Pear CM bot runtime is hosted on RelaxDev."
          echo "This workflow intentionally does not start iris.py."

name: Run Pear CM

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # UTC; GitHub may delay scheduled jobs

permissions:
  contents: read

# GitHub-hosted runners are temporary; this does not guarantee uninterrupted 24/7 uptime.
concurrency:
  group: pear-cm-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate syntax
        run: |
          python -m py_compile iris.py
          python -m py_compile moderation_full.py

      - name: Run bot with process restart every 3 hours
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_OWNER_ID: ${{ vars.BOT_OWNER_ID || '6652898792' }}
        run: |
          set +e
          while true; do
            echo "Starting Pear CM at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout --signal=TERM --kill-after=20s 3h python -u iris.py
            code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "Three hours reached; restarting bot process."
            else
              echo "Bot exited with code $code; retrying in 10 seconds."
            fi
            sleep 10
          done
